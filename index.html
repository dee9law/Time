<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mawaqit · مواقيت</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: #e5e5e5;
    --accent: #c9a96e;
    --accent-light: #f5efe3;
    --green: #4a7c59;
    --green-light: #e8f5e9;
    --red: #b85450;
    --red-light: #fde8e8;
    --amber: #c9a96e;
    --amber-light: #fff8e1;
    --mono: 'IBM Plex Mono', monospace;
    --arabic: 'Noto Naskh Arabic', serif;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }

  .header { padding: 24px 20px 12px; text-align: center; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
  .header h1 { font-family: var(--arabic); font-size: 28px; font-weight: 700; letter-spacing: 2px; color: var(--text); }
  .header .subtitle { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); margin-top: 4px; }
  .header .live-clock { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 8px; letter-spacing: 1px; }

  .nav { display: flex; justify-content: center; gap: 8px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 89px; z-index: 99; }
  .nav-btn { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 16px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; border-radius: 4px; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active { background: var(--accent); color: var(--surface); border-color: var(--accent); }

  .screen { display: none; padding: 20px; max-width: 720px; margin: 0 auto; min-height: calc(100vh - 160px); }
  .screen.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .loc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 16px; }
  .loc-card h2 { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); margin-bottom: 16px; }
  .coords-display { font-family: var(--mono); font-size: 13px; color: var(--accent); margin-bottom: 12px; word-break: break-all; }
  .location-name { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
  #map { height: 320px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 16px; background: #f0f0f0; }
  .btn-primary { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; padding: 14px 24px; background: var(--accent); color: var(--surface); border: none; border-radius: 4px; cursor: pointer; width: 100%; transition: opacity 0.2s; -webkit-tap-highlight-color: transparent; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .gps-btn { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; border-radius: 4px; margin-bottom: 12px; width: 100%; -webkit-tap-highlight-color: transparent; }
  .gps-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gps-btn:disabled { opacity: 0.6; }

  .prayer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
  .prayer-card.forbidden { border-color: var(--red); background: var(--red-light); }
  .prayer-card.allowed { border-color: var(--green); background: var(--green-light); }
  .prayer-card.past-preferred { border-color: var(--amber); background: var(--amber-light); }
  .prayer-info { flex: 1; min-width: 0; }
  .prayer-name-ar { font-family: var(--arabic); font-size: 22px; font-weight: 600; }
  .prayer-name-en { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); margin-top: 2px; }
  .prayer-angle { font-family: var(--mono); font-size: 10px; color: var(--accent); margin-top: 4px; }
  .prayer-time { font-family: var(--mono); font-size: 22px; font-weight: 500; text-align: right; white-space: nowrap; }
  .prayer-end { font-family: var(--mono); font-size: 9px; color: var(--text-secondary); margin-top: 4px; text-align: right; }
  .badge { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; border-radius: 3px; display: inline-block; margin-top: 8px; }
  .badge.forbidden { background: var(--red); color: white; }
  .badge.allowed { background: var(--green); color: white; }
  .badge.past { background: var(--amber); color: var(--text); }
  .badge.istiwa { background: var(--red); color: white; }

  .range-controls { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .range-select { font-family: var(--mono); font-size: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); width: 100%; margin-bottom: 12px; }
  .range-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  .range-table th { text-align: left; padding: 10px 8px; border-bottom: 2px solid var(--border); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; font-size: 9px; color: var(--text-secondary); }
  .range-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
  .range-table tr:hover td { background: var(--accent-light); }
  .export-btn { margin-top: 16px; }
  .export-status { font-family: var(--mono); font-size: 10px; color: var(--green); margin-top: 8px; text-align: center; }
  .export-status.error { color: var(--red); }

  .footer { text-align: center; padding: 24px; font-family: var(--mono); font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px; border-top: 1px solid var(--border); margin-top: 40px; }

  .error-box { background: var(--red-light); border: 1px solid var(--red); color: var(--red); padding: 12px; border-radius: 4px; font-family: var(--mono); font-size: 10px; margin: 12px 0; }
  .info-box { background: var(--accent-light); border: 1px solid var(--accent); color: var(--text); padding: 12px; border-radius: 4px; font-family: var(--mono); font-size: 10px; margin: 12px 0; }

  @media (max-width: 480px) {
    .header h1 { font-size: 22px; }
    .prayer-time { font-size: 18px; }
    #map { height: 260px; }
    .range-table { font-size: 9px; }
    .range-table th, .range-table td { padding: 6px 4px; }
    .prayer-card { flex-direction: column; align-items: flex-start; gap: 8px; }
    .prayer-time { text-align: left; }
    .prayer-end { text-align: left; }
  }

  .loading { text-align: center; padding: 40px; font-family: var(--mono); font-size: 11px; color: var(--text-secondary); letter-spacing: 2px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>مواقيت</h1>
  <div class="subtitle">Islamic Prayer Times · Astronomically Precise · Location Aware</div>
  <div class="live-clock" id="liveClock">--:--:--</div>
</div>

<div class="nav">
  <button class="nav-btn active" data-screen="location">Location</button>
  <button class="nav-btn" data-screen="today">Today</button>
  <button class="nav-btn" data-screen="range">Range & Export</button>
</div>

<!-- SCREEN 1: LOCATION -->
<div class="screen active" id="screen-location">
  <div class="loc-card">
    <h2>GPS Location</h2>
    <div class="coords-display" id="coordsDisplay">No location set</div>
    <div class="location-name" id="locationName">--</div>
    <button class="gps-btn" id="gpsBtn">📍 Detect My Location via GPS</button>
    <div id="map"></div>
    <p style="font-family: var(--mono); font-size: 10px; color: var(--text-secondary); margin-bottom: 12px; text-align: center;">Drag the pin to adjust manually</p>
    <button class="btn-primary" id="confirmBtn" disabled>Confirm Location</button>
    <div id="locError"></div>
  </div>
</div>

<!-- SCREEN 2: TODAY'S PRAYERS -->
<div class="screen" id="screen-today">
  <div id="todayPrayers">
    <div class="loading"><span class="spinner"></span>Please set your location first</div>
  </div>
</div>

<!-- SCREEN 3: RANGE & EXPORT -->
<div class="screen" id="screen-range">
  <div class="range-controls">
    <h2 style="font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); margin-bottom: 16px;">Select Range</h2>
    <select class="range-select" id="rangeSelect">
      <option value="1">1 Day</option>
      <option value="7">1 Week</option>
      <option value="30">1 Month</option>
    </select>
    <div id="rangeTableContainer">
      <div class="loading">Please set your location first</div>
    </div>
    <button class="btn-primary export-btn" id="exportBtn">Add to Google Calendar</button>
    <div class="export-status" id="exportStatus"></div>
  </div>
</div>

<div class="footer">Mawaqit · Static · Free · Astronomically Precise · <span id="year"></span></div>

<!-- Load Leaflet from jsDelivr (most reliable CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

<!-- Load Adhan.js from jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/dist/adhan.umd.min.js" crossorigin="anonymous"></script>

<script>
// ==================== CONFIG ====================
const CONFIG = {
  FAJR_ANGLE: 18,
  MAGHRIB_ANGLE: 18,
  ISHA_ANGLE: 21,
  ASR_SHADOW_FACTOR: 1,
  GOOGLE_CLIENT_ID: '',
  POST_FAJR_MINUTES: 15,
  ISTIWA_MINUTES_BEFORE: 5,
  PRAYER_DURATION: 30,
};

// ==================== STATE ====================
let state = {
  lat: null,
  lng: null,
  locationName: '',
  map: null,
  marker: null,
  prayerTimes: null,
  rangeData: [],
  googleToken: null,
  libsLoaded: { leaflet: false, adhan: false }
};

// ==================== SCREEN NAVIGATION ====================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelector('.nav-btn[data-screen="' + name + '"]').classList.add('active');

  if (name === 'today' && state.lat) renderToday();
  if (name === 'range' && state.lat) generateRange();
}

// Attach nav click handlers
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    showScreen(this.dataset.screen);
  });
});

// ==================== LIBRARY CHECK ====================
function checkLibs() {
  state.libsLoaded.leaflet = typeof L !== 'undefined';
  state.libsLoaded.adhan = typeof adhan !== 'undefined';

  if (!state.libsLoaded.leaflet) {
    document.getElementById('locError').innerHTML = '<div class="error-box">Map library (Leaflet) failed to load. Check your internet connection and refresh.</div>';
  }
  if (!state.libsLoaded.adhan) {
    document.getElementById('locError').innerHTML += '<div class="error-box">Prayer calculation library (Adhan.js) failed to load. Check your internet connection and refresh.</div>';
  }

  if (state.libsLoaded.leaflet) {
    initMap();
  }
}

// ==================== MAP ====================
function initMap() {
  if (!state.libsLoaded.leaflet) return;

  try {
    const defaultLat = 21.4225;
    const defaultLng = 39.8262;

    state.map = L.map('map').setView([defaultLat, defaultLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(state.map);

    state.marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(state.map);
    state.marker.on('dragend', function(e) {
      const pos = e.target.getLatLng();
      updateCoords(pos.lat, pos.lng);
    });

    state.map.on('click', function(e) {
      state.marker.setLatLng(e.latlng);
      updateCoords(e.latlng.lat, e.latlng.lng);
    });

    updateCoords(defaultLat, defaultLng);
  } catch (err) {
    document.getElementById('locError').innerHTML = '<div class="error-box">Map init error: ' + err.message + '</div>';
  }
}

function updateCoords(lat, lng) {
  state.lat = lat;
  state.lng = lng;
  document.getElementById('coordsDisplay').textContent = lat.toFixed(4) + '°N · ' + lng.toFixed(4) + '°E';
  document.getElementById('confirmBtn').disabled = false;

  // Reverse geocode
  fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json')
    .then(r => r.json())
    .then(data => {
      const name = data.display_name || data.name || 'Unknown Location';
      state.locationName = name;
      document.getElementById('locationName').textContent = name;
    })
    .catch(() => {
      state.locationName = 'Custom Location';
      document.getElementById('locationName').textContent = 'Custom Location';
    });
}

function requestGPS() {
  if (!navigator.geolocation) {
    alert('Geolocation not supported by your browser');
    return;
  }

  const btn = document.getElementById('gpsBtn');
  btn.textContent = 'Detecting...';
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      if (state.map) {
        state.map.setView([latitude, longitude], 15);
        state.marker.setLatLng([latitude, longitude]);
      }
      updateCoords(latitude, longitude);
      btn.textContent = '✓ Location Detected';
      setTimeout(() => { btn.textContent = '📍 Detect My Location via GPS'; btn.disabled = false; }, 2000);
    },
    (err) => {
      alert('GPS error: ' + err.message);
      btn.textContent = '📍 Detect My Location via GPS';
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

document.getElementById('gpsBtn').addEventListener('click', requestGPS);

function confirmLocation() {
  renderToday();
  generateRange();
  showScreen('today');
}

document.getElementById('confirmBtn').addEventListener('click', confirmLocation);

// ==================== PRAYER CALCULATIONS ====================
function getPrayerTimesForDate(date) {
  if (!state.libsLoaded.adhan || !state.lat || !state.lng) return null;

  try {
    const coords = new adhan.Coordinates(state.lat, state.lng);
    const params = adhan.CalculationMethod.Other();
    params.fajrAngle = CONFIG.FAJR_ANGLE;
    params.maghribAngle = CONFIG.MAGRIB_ANGLE;
    params.ishaAngle = CONFIG.ISHA_ANGLE;
    params.madhab = adhan.Madhab.Shafi;

    const times = new adhan.PrayerTimes(coords, date, params);
    return {
      fajr: times.fajr,
      sunrise: times.sunrise,
      dhuhr: times.dhuhr,
      asr: times.asr,
      maghrib: times.maghrib,
      isha: times.isha,
    };
  } catch (err) {
    console.error('Prayer calc error:', err);
    return null;
  }
}

function formatTime(date) {
  if (!date || isNaN(date.getTime())) return '--:--';
  return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function formatDate(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ==================== FORBIDDEN WINDOWS ====================
function getForbiddenStatus(prayer, times, now) {
  const fajrEnd = new Date(times.sunrise.getTime() + CONFIG.POST_FAJR_MINUTES * 60000);
  const istiwaStart = new Date(times.dhuhr.getTime() - CONFIG.ISTIWA_MINUTES_BEFORE * 60000);
  const maghribMs = times.maghrib.getTime();
  const nextFajrMs = times.fajr.getTime() + 24 * 60 * 60 * 1000;
  const astronomicalMidnight = new Date(maghribMs + (nextFajrMs - maghribMs) / 2);

  switch(prayer) {
    case 'fajr':
      if (now >= times.fajr && now < fajrEnd) {
        return { status: 'forbidden', label: 'FORBIDDEN UNTIL ' + formatTime(fajrEnd), until: fajrEnd };
      }
      if (now >= fajrEnd && now < times.sunrise) {
        return { status: 'forbidden', label: 'FORBIDDEN UNTIL ' + formatTime(times.sunrise), until: times.sunrise };
      }
      return { status: 'allowed', label: 'STARTS PRAYER' };

    case 'dhuhr':
      if (now >= istiwaStart && now < times.dhuhr) {
        return { status: 'forbidden', label: 'ISTIWA' — WAIT', until: times.dhuhr };
      }
      return { status: 'allowed', label: 'STARTS PRAYER' };

    case 'asr':
      if (now >= times.asr && now < times.maghrib) {
        return { status: 'forbidden', label: 'NAFL FORBIDDEN — FARD VALID', until: times.maghrib };
      }
      return { status: 'allowed', label: 'STARTS PRAYER' };

    case 'maghrib':
      return { status: 'allowed', label: 'STARTS PRAYER' };

    case 'isha':
      if (now > astronomicalMidnight) {
        return { status: 'past-preferred', label: 'PAST PREFERRED — STILL VALID', until: times.fajr };
      }
      return { status: 'allowed', label: 'STARTS PRAYER' };

    default:
      return { status: 'allowed', label: '' };
  }
}

// ==================== TODAY SCREEN ====================
function renderToday() {
  const container = document.getElementById('todayPrayers');
  const now = new Date();
  const times = getPrayerTimesForDate(now);

  if (!times) {
    container.innerHTML = '<div class="loading">Please set your location first</div>';
    return;
  }

  state.prayerTimes = times;

  const prayers = [
    { key: 'fajr', ar: 'الفجر', en: 'Fajr', angle: '-18°', desc: 'Astronomical Dawn' },
    { key: 'dhuhr', ar: 'الظهر', en: 'Dhuhr · Zawal', angle: 'Solar Noon', desc: 'Sun at meridian' },
    { key: 'asr', ar: 'العصر', en: 'Asr · Shadow 1:1', angle: 'Shadow Factor 1', desc: 'Shadow = object + noon shadow' },
    { key: 'maghrib', ar: 'المغرب', en: 'Maghrib', angle: '-18°', desc: 'Sun at -18° below western horizon' },
    { key: 'isha', ar: 'العشاء', en: 'Isha · -21°', angle: '-21°', desc: 'Deep twilight end — full darkness' },
  ];

  let html = '';
  prayers.forEach(p => {
    const time = times[p.key];
    const status = getForbiddenStatus(p.key, times, now);
    const cardClass = status.status === 'forbidden' ? 'forbidden' : 
                     status.status === 'past-preferred' ? 'past-preferred' : 'allowed';

    let endTime = '';
    if (p.key === 'fajr') endTime = 'Ends: ' + formatTime(times.sunrise);
    if (p.key === 'dhuhr') endTime = 'Istiwa': ' + formatTime(new Date(times.dhuhr.getTime() - CONFIG.ISTIWA_MINUTES_BEFORE * 60000)) + '–' + formatTime(times.dhuhr);
    if (p.key === 'asr') endTime = 'Ends: ' + formatTime(times.maghrib);
    if (p.key === 'isha') {
      const maghribMs = times.maghrib.getTime();
      const nextFajrMs = times.fajr.getTime() + 24 * 60 * 60 * 1000;
      const midnight = new Date(maghribMs + (nextFajrMs - maghribMs) / 2);
      endTime = 'Preferred end: ' + formatTime(midnight);
    }

    html += '<div class="prayer-card ' + cardClass + '">' +
      '<div class="prayer-info">' +
        '<div class="prayer-name-ar">' + p.ar + '</div>' +
        '<div class="prayer-name-en">' + p.en + '</div>' +
        '<div class="prayer-angle">' + p.angle + ' · ' + p.desc + '</div>' +
        '<span class="badge ' + status.status + '">' + status.label + '</span>' +
      '</div>' +
      '<div>' +
        '<div class="prayer-time">' + formatTime(time) + '</div>' +
        '<div class="prayer-end">' + endTime + '</div>' +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}

// ==================== LIVE CLOCK ====================
setInterval(function() {
  var now = new Date();
  document.getElementById('liveClock').textContent = 
    now.toLocaleTimeString('en-US', { hour12: false }) + ' · ' + 
    now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  if (document.getElementById('screen-today').classList.contains('active') && state.lat) {
    renderToday();
  }
}, 1000);

// ==================== RANGE SCREEN ====================
document.getElementById('rangeSelect').addEventListener('change', generateRange);

function generateRange() {
  const container = document.getElementById('rangeTableContainer');
  const days = parseInt(document.getElementById('rangeSelect').value);

  if (!state.lat) {
    container.innerHTML = '<div class="loading">Please set your location first</div>';
    return;
  }

  let html = '<table class="range-table"><thead><tr>' +
    '<th>Date</th><th>Fajr</th><th>Sunrise</th><th>Dhuhr</th><th>Asr</th><th>Maghrib</th><th>Isha</th>' +
    '</tr></thead><tbody>';

  state.rangeData = [];
  var today = new Date();

  for (var i = 0; i < days; i++) {
    var date = new Date(today);
    date.setDate(today.getDate() + i);

    var times = getPrayerTimesForDate(date);
    if (!times) continue;

    var row = {
      date: date,
      fajr: times.fajr,
      sunrise: times.sunrise,
      dhuhr: times.dhuhr,
      asr: times.asr,
      maghrib: times.maghrib,
      isha: times.isha,
    };
    state.rangeData.push(row);

    html += '<tr>' +
      '<td><strong>' + formatDate(date) + '</strong></td>' +
      '<td>' + formatTime(times.fajr) + '</td>' +
      '<td>' + formatTime(times.sunrise) + '</td>' +
      '<td>' + formatTime(times.dhuhr) + '</td>' +
      '<td>' + formatTime(times.asr) + '</td>' +
      '<td>' + formatTime(times.maghrib) + '</td>' +
      '<td>' + formatTime(times.isha) + '</td>' +
    '</tr>';
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

// ==================== GOOGLE CALENDAR EXPORT ====================
document.getElementById('exportBtn').addEventListener('click', exportToGoogleCalendar);

function exportToGoogleCalendar() {
  if (!CONFIG.GOOGLE_CLIENT_ID) {
    alert('Google Calendar export requires a Google OAuth Client ID.

Setup:
1. Go to Google Cloud Console
2. Create a project & enable Google Calendar API
3. Create OAuth 2.0 Client ID (Web Application)
4. Add this GitHub Pages URL to authorized origins
5. Paste the Client ID in config.js');
    return;
  }

  if (!state.rangeData.length) {
    alert('Please generate a range table first');
    return;
  }

  if (typeof google === 'undefined' || !google.accounts) {
    document.getElementById('exportStatus').textContent = 'Google Sign-In library not loaded. Please refresh and try again.';
    document.getElementById('exportStatus').className = 'export-status error';
    return;
  }

  var tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: function(tokenResponse) {
      if (tokenResponse.error) {
        document.getElementById('exportStatus').textContent = 'Error: ' + tokenResponse.error;
        document.getElementById('exportStatus').className = 'export-status error';
        return;
      }
      state.googleToken = tokenResponse.access_token;
      batchCreateEvents();
    },
  });

  tokenClient.requestAccessToken();
}

function batchCreateEvents() {
  var statusEl = document.getElementById('exportStatus');
  statusEl.textContent = 'Creating events...';
  statusEl.className = 'export-status';

  var prayers = [
    { key: 'fajr', ar: 'الفجر', en: 'Fajr' },
    { key: 'dhuhr', ar: 'الظهر', en: 'Dhuhr' },
    { key: 'asr', ar: 'العصر', en: 'Asr' },
    { key: 'maghrib', ar: 'المغرب', en: 'Maghrib' },
    { key: 'isha', ar: 'العشاء', en: 'Isha' },
  ];

  var created = 0;
  var total = state.rangeData.length * prayers.length;
  var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  state.rangeData.forEach(function(day) {
    prayers.forEach(function(p) {
      var start = day[p.key];
      var end = new Date(start.getTime() + CONFIG.PRAYER_DURATION * 60000);

      var event = {
        summary: p.ar + ' · ' + p.en,
        description: 'Astronomically calculated for ' + state.locationName + ' (lat: ' + state.lat.toFixed(3) + ', lng: ' + state.lng.toFixed(3) + ')

Mawaqit Prayer Time',
        start: { dateTime: start.toISOString(), timeZone: tz },
        end: { dateTime: end.toISOString(), timeZone: tz },
        reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 10 }] },
      };

      fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + state.googleToken,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(event),
      })
      .then(function(r) { return r.json(); })
      .then(function() {
        created++;
        statusEl.textContent = 'Created ' + created + '/' + total + ' events...';
        if (created >= total) {
          statusEl.textContent = '✓ Successfully created ' + total + ' prayer events in Google Calendar!';
        }
      })
      .catch(function(err) {
        statusEl.textContent = 'Error creating events: ' + err.message;
        statusEl.className = 'export-status error';
      });
    });
  });
}

// ==================== INIT ====================
document.getElementById('year').textContent = new Date().getFullYear();

// Wait for libraries to load, then init
function waitForLibs() {
  var attempts = 0;
  var maxAttempts = 50; // 5 seconds

  var interval = setInterval(function() {
    attempts++;
    state.libsLoaded.leaflet = typeof L !== 'undefined';
    state.libsLoaded.adhan = typeof adhan !== 'undefined';

    if (state.libsLoaded.leaflet && state.libsLoaded.adhan) {
      clearInterval(interval);
      document.getElementById('locError').innerHTML = '';
      initMap();
    } else if (attempts >= maxAttempts) {
      clearInterval(interval);
      var errors = [];
      if (!state.libsLoaded.leaflet) errors.push('Leaflet (map)');
      if (!state.libsLoaded.adhan) errors.push('Adhan.js (prayer calculations)');
      document.getElementById('locError').innerHTML = '<div class="error-box">Failed to load: ' + errors.join(', ') + '. Check your internet connection and refresh the page.</div>';
    }
  }, 100);
}

// Start when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', waitForLibs);
} else {
  waitForLibs();
}
