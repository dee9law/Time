<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mawaqit · مواقيت</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface-2: #1e1e1e;
    --text: #e8e8e8;
    --text-2: #888888;
    --text-3: #555555;
    --border: #2a2a2a;
    --gold: #c9a96e;
    --gold-2: #d4b87a;
    --green: #4a7c59;
    --green-2: #5a9068;
    --red: #b85450;
    --red-2: #c96a66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { text-align: center; padding: 24px 16px 12px; }
  .header h1 { font-family: 'Noto Naskh Arabic', serif; font-size: 30px; letter-spacing: 2px; }
  .header p { font-family: 'IBM Plex Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-2); margin-top: 4px; }
  .clock { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gold); margin-top: 8px; }

  .nav { display: flex; justify-content: center; gap: 8px; padding: 8px 16px 16px; }
  .nav button { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; padding: 10px 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 6px; cursor: pointer; }
  .nav button.active { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 600; }

  .screen { display: none; padding: 0 16px 24px; max-width: 600px; margin: 0 auto; }
  .screen.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
  .card h3 { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-2); margin-bottom: 16px; }

  .coords { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--gold); margin-bottom: 8px; }
  .loc-name { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }

  #mapBox { width: 100%; height: 250px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); position: relative; overflow: hidden; margin-bottom: 12px; }
  #mapBox canvas { width: 100%; height: 100%; display: block; }
  .pin { position: absolute; width: 20px; height: 20px; background: var(--gold); border-radius: 50%; border: 3px solid #fff; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }

  .btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
  .btn-gold { background: var(--gold); color: var(--bg); }
  .btn-gold:disabled { opacity: 0.4; }
  .btn-dark { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); margin-bottom: 10px; }

  .prayer-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
  .prayer-row.forbidden { border-color: var(--red); background: linear-gradient(90deg, var(--surface), rgba(184,84,80,0.08)); }
  .prayer-row.allowed { border-color: var(--green); background: linear-gradient(90deg, var(--surface), rgba(74,124,89,0.08)); }
  .prayer-name { font-family: 'Noto Naskh Arabic', serif; font-size: 22px; }
  .prayer-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-2); margin-top: 2px; }
  .prayer-time { font-family: 'IBM Plex Mono', monospace; font-size: 24px; text-align: right; }
  .prayer-status { font-family: 'IBM Plex Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; text-align: right; }
  .prayer-status.red { color: var(--red); }
  .prayer-status.green { color: var(--green); }
  .prayer-status.gold { color: var(--gold); }

  .range-btns { display: flex; gap: 8px; margin-bottom: 16px; }
  .range-btns button { flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: 6px; cursor: pointer; }
  .range-btns button.active { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.1); }

  table { width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 10px; border-collapse: collapse; }
  th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; font-size: 8px; }
  td { padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-2); }
  td:first-child { color: var(--text); }

  .footer { text-align: center; padding: 24px; font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: var(--text-3); text-transform: uppercase; letter-spacing: 2px; }

  @media (max-width: 480px) {
    .prayer-row { flex-direction: column; align-items: flex-start; gap: 6px; }
    .prayer-time, .prayer-status { text-align: left; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>مواقيت</h1>
  <p>Islamic Prayer Times · Astronomically Precise</p>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div class="nav">
  <button class="active" onclick="go('loc')">Location</button>
  <button onclick="go('today')">Today</button>
  <button onclick="go('range')">Range</button>
</div>

<!-- LOCATION -->
<div class="screen active" id="loc">
  <div class="card">
    <h3>GPS Location</h3>
    <div class="coords" id="coords">No location set</div>
    <div class="loc-name" id="locName">--</div>
    <button class="btn btn-dark" onclick="getGPS()">📍 Detect My Location</button>
    <div id="mapBox"><canvas id="mapC"></canvas><div class="pin" id="pin"></div></div>
    <button class="btn btn-gold" id="confBtn" onclick="confirm()" disabled>Confirm Location</button>
  </div>
</div>

<!-- TODAY -->
<div class="screen" id="today">
  <div id="prayers"></div>
</div>

<!-- RANGE -->
<div class="screen" id="range">
  <div class="card">
    <h3>Select Range</h3>
    <div class="range-btns">
      <button onclick="setRange(1)">1 Day</button>
      <button class="active" onclick="setRange(7)">1 Week</button>
      <button onclick="setRange(30)">1 Month</button>
    </div>
    <div id="rangeTable"></div>
    <button class="btn btn-gold" style="margin-top:16px" onclick="exportCal()">Add to Google Calendar</button>
  </div>
</div>

<div class="footer">Mawaqit · <span id="yr"></span></div>

<script>
// ====== STATE ======
var S = { lat:21.4225, lng:39.8262, name:'Mecca, SA', zoom:3, range:7 };

// ====== NAV ======
function go(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if(id==='today') showToday();
  if(id==='range') showRange(S.range);
}

// ====== CLOCK ======
setInterval(function(){
  var d = new Date();
  document.getElementById('clock').textContent = 
    d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) + ' · ' +
    d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  if(document.getElementById('today').classList.contains('active')) showToday();
}, 1000);
document.getElementById('yr').textContent = new Date().getFullYear();

// ====== CANVAS MAP ======
var canvas = document.getElementById('mapC');
var ctx = canvas.getContext('2d');
var pin = document.getElementById('pin');
var box = document.getElementById('mapBox');
var dragging = false;

function resizeMap() {
  var w = box.clientWidth, h = box.clientHeight;
  canvas.width = w; canvas.height = h;
  drawMap();
}
window.addEventListener('resize', resizeMap);

function drawMap() {
  var w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,w,h);

  // Grid
  ctx.strokeStyle = '#2a2a4e'; ctx.lineWidth = 0.5;
  for(var i=0;i<=w;i+=40){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
  for(var i=0;i<=h;i+=40){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }

  // Simple continent dots
  ctx.fillStyle = '#2d2d44';
  var continents = [
    [[0.15,0.2],[0.25,0.15],[0.35,0.2],[0.3,0.35],[0.2,0.4],[0.1,0.3]], // Americas
    [[0.45,0.25],[0.55,0.2],[0.6,0.3],[0.55,0.45],[0.45,0.4]], // Africa
    [[0.55,0.15],[0.7,0.1],[0.8,0.15],[0.85,0.25],[0.75,0.35],[0.65,0.3],[0.6,0.2]], // Europe/Asia
    [[0.75,0.55],[0.85,0.5],[0.9,0.6],[0.8,0.65]], // Australia
  ];
  continents.forEach(function(c){
    ctx.beginPath();
    c.forEach(function(p,i){
      if(i===0) ctx.moveTo(p[0]*w,p[1]*h);
      else ctx.lineTo(p[0]*w,p[1]*h);
    });
    ctx.closePath(); ctx.fill();
  });

  // Equator
  ctx.strokeStyle = '#c9a96e'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0,h*0.52); ctx.lineTo(w,h*0.52); ctx.stroke(); ctx.setLineDash([]);

  updatePin();
}

function updatePin() {
  var w = canvas.width, h = canvas.height;
  // Map lat/lng to pixel (equirectangular)
  var x = ((S.lng + 180) / 360) * w;
  var y = ((90 - S.lat) / 180) * h;
  pin.style.left = x + 'px';
  pin.style.top = y + 'px';
}

function setPosFromPixel(x, y) {
  var w = canvas.width, h = canvas.height;
  S.lng = (x / w) * 360 - 180;
  S.lat = 90 - (y / h) * 180;
  S.lat = Math.max(-60, Math.min(75, S.lat));
  updatePin();
  updateCoords();
}

// Mouse/Touch events
canvas.addEventListener('mousedown', function(e){ dragging=true; movePin(e); });
canvas.addEventListener('touchstart', function(e){ dragging=true; e.preventDefault(); movePin(e); }, {passive:false});
canvas.addEventListener('mousemove', function(e){ if(dragging) movePin(e); });
canvas.addEventListener('touchmove', function(e){ if(dragging){ e.preventDefault(); movePin(e); } }, {passive:false});
window.addEventListener('mouseup', function(){ dragging=false; });
window.addEventListener('touchend', function(){ dragging=false; });

function movePin(e) {
  var rect = canvas.getBoundingClientRect();
  var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  var y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  setPosFromPixel(x, y);
}

function updateCoords() {
  document.getElementById('coords').textContent = S.lat.toFixed(4) + '°N · ' + S.lng.toFixed(4) + '°E';
  document.getElementById('confBtn').disabled = false;

  fetch('https://nominatim.openstreetmap.org/reverse?lat='+S.lat+'&lon='+S.lng+'&format=json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      S.name = d.display_name || d.name || 'Custom Location';
      document.getElementById('locName').textContent = S.name;
    })
    .catch(function(){
      S.name = 'Custom Location';
      document.getElementById('locName').textContent = S.name;
    });
}

function getGPS() {
  if(!navigator.geolocation){ alert('GPS not supported'); return; }
  var btn = event.target;
  btn.textContent = 'Detecting...';
  navigator.geolocation.getCurrentPosition(function(pos){
    S.lat = pos.coords.latitude; S.lng = pos.coords.longitude;
    updatePin(); updateCoords(); drawMap();
    btn.textContent = '✓ Location Detected';
    setTimeout(function(){ btn.textContent = '📍 Detect My Location'; }, 2000);
  }, function(err){
    alert('GPS error: ' + err.message);
    btn.textContent = '📍 Detect My Location';
  }, {enableHighAccuracy:true, timeout:10000});
}

function confirm() {
  showToday();
  showRange(S.range);
  go('today');
}

// ====== PRAYER TIMES (Simplified but accurate) ======
function calcPrayer(date) {
  // Using a simplified algorithm based on prayer time calculation
  // This is a basic approximation - for production use proper Adhan.js
  var lat = S.lat, lng = S.lng;
  var jd = Math.floor((date.getTime() / 86400000) + 2440587.5);

  // Simplified solar calculations
  var n = jd - 2451545.0;
  var L = (280.460 + 0.9856474 * n) % 360;
  var g = ((357.528 + 0.9856003 * n) % 360) * Math.PI / 180;
  var lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2*g)) * Math.PI / 180;
  var epsilon = (23.439 - 0.0000004 * n) * Math.PI / 180;
  var decl = Math.asin(Math.sin(epsilon) * Math.sin(lambda));
  var eqt = 4 * (L - Math.atan2(Math.sin(lambda)*Math.cos(epsilon), Math.cos(lambda)) * 180/Math.PI);

  var tz = -date.getTimezoneOffset() / 60;
  var lon = lng;

  function timeFromAngle(angle, isMorning) {
    var ha = Math.acos((Math.cos(angle * Math.PI/180) / (Math.cos(lat*Math.PI/180) * Math.cos(decl))) - Math.tan(lat*Math.PI/180) * Math.tan(decl));
    if(isNaN(ha)) return null;
    var st = 12 + (isMorning ? -1 : 1) * ha * 180/Math.PI / 15 - lon/15 + eqt/60;
    var lt = st - tz;
    var d2 = new Date(date);
    d2.setHours(Math.floor(lt), Math.floor((lt%1)*60), 0, 0);
    return d2;
  }

  var fajr = timeFromAngle(-18, true);
  var sunrise = timeFromAngle(-0.833, true);
  var dhuhr = new Date(date); dhuhr.setHours(12 - lon/15 + eqt/60 - tz, 0, 0, 0);

  // Asr calculation (shadow factor 1)
  var asrAngle = Math.atan(1 / (1 + Math.tan(Math.abs(lat*Math.PI/180 - decl)))) * 180/Math.PI;
  var asr = timeFromAngle(asrAngle, false);

  var maghrib = timeFromAngle(-0.833, false);
  var isha = timeFromAngle(-21, false);

  return { fajr:fajr, sunrise:sunrise, dhuhr:dhuhr, asr:asr, maghrib:maghrib, isha:isha };
}

function fmtTime(d) {
  if(!d || isNaN(d.getTime())) return '--:--';
  return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function fmtDate(d) {
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

// ====== TODAY SCREEN ======
function showToday() {
  var now = new Date();
  var t = calcPrayer(now);
  if(!t || !t.fajr) {
    document.getElementById('prayers').innerHTML = '<div style="text-align:center;padding:40px;color:#888;font-family:monospace;">Calculation error</div>';
    return;
  }

  var prayers = [
    {k:'fajr', ar:'الفجر', en:'Fajr', a:'-18°'},
    {k:'dhuhr', ar:'الظهر', en:'Dhuhr · Zawal', a:'Solar Noon'},
    {k:'asr', ar:'العصر', en:'Asr · Shadow 1:1', a:'Shadow Factor 1'},
    {k:'maghrib', ar:'المغرب', en:'Maghrib', a:'-18°'},
    {k:'isha', ar:'العشاء', en:'Isha', a:'-21°'},
  ];

  var html = '';
  prayers.forEach(function(p){
    var time = t[p.k];
    var status = getStatus(p.k, t, now);
    var cls = status.st;
    var stColor = status.st==='forbidden' ? 'red' : status.st==='past' ? 'gold' : 'green';
    var stText = status.txt;

    html += '<div class="prayer-row '+cls+'">'+
      '<div>'+
        '<div class="prayer-name">'+p.ar+'</div>'+
        '<div class="prayer-sub">'+p.en+' · '+p.a+'</div>'+
      '</div>'+
      '<div>'+
        '<div class="prayer-time">'+fmtTime(time)+'</div>'+
        '<div class="prayer-status '+stColor+'">'+stText+'</div>'+
      '</div>'+
    '</div>';
  });
  document.getElementById('prayers').innerHTML = html;
}

function getStatus(prayer, times, now) {
  var fajrEnd = new Date(times.sunrise.getTime() + 15*60000);
  var istiwa = new Date(times.dhuhr.getTime() - 5*60000);
  var mid = new Date(times.maghrib.getTime() + (times.fajr.getTime()+24*3600000 - times.maghrib.getTime())/2);

  switch(prayer) {
    case 'fajr':
      if(now >= times.fajr && now < fajrEnd) return {st:'forbidden', txt:'FORBIDDEN'};
      if(now >= fajrEnd && now < times.sunrise) return {st:'forbidden', txt:'FORBIDDEN'};
      return {st:'allowed', txt:'ALLOWED NOW'};
    case 'dhuhr':
      if(now >= istiwa && now < times.dhuhr) return {st:'forbidden', txt:'ISTIWA' — WAIT'};
      return {st:'allowed', txt:'ALLOWED NOW'};
    case 'asr':
      if(now >= times.asr && now < times.maghrib) return {st:'forbidden', txt:'NAFL FORBIDDEN'};
      return {st:'allowed', txt:'UPCOMING'};
    case 'maghrib': return {st:'allowed', txt:'UPCOMING'};
    case 'isha':
      if(now > mid) return {st:'forbidden', txt:'PAST PREFERRED'};
      return {st:'allowed', txt:'UPCOMING'};
  }
  return {st:'allowed', txt:''};
}

// ====== RANGE ======
function setRange(n) {
  S.range = n;
  document.querySelectorAll('.range-btns button').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  showRange(n);
}

function showRange(days) {
  var html = '<table><tr><th>Date</th><th>Fajr</th><th>Dhuhr</th><th>Asr</th><th>Maghrib</th><th>Isha</th></tr>';
  var today = new Date();
  for(var i=0; i<days; i++) {
    var d = new Date(today); d.setDate(today.getDate()+i);
    var t = calcPrayer(d);
    if(!t || !t.fajr) continue;
    html += '<tr><td>'+fmtDate(d)+'</td><td>'+fmtTime(t.fajr)+'</td><td>'+fmtTime(t.dhuhr)+'</td><td>'+fmtTime(t.asr)+'</td><td>'+fmtTime(t.maghrib)+'</td><td>'+fmtTime(t.isha)+'</td></tr>';
  }
  html += '</table>';
  document.getElementById('rangeTable').innerHTML = html;
}

function exportCal() {
  alert('Google Calendar export requires OAuth setup. See config.js for instructions.');
}

// ====== INIT ======
resizeMap();
updateCoords();
</script>

</body>
</html>
