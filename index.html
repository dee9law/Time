<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mawaqit · مواقيت</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface-elevated: #1e1e1e;
    --text: #e8e8e8;
    --text-secondary: #888888;
    --text-muted: #555555;
    --border: #2a2a2a;
    --accent: #c9a96e;
    --accent-light: #d4b87a;
    --accent-dark: #a88b52;
    --green: #4a7c59;
    --green-light: #5a9068;
    --green-glow: rgba(74,124,89,0.15);
    --red: #b85450;
    --red-light: #c96a66;
    --red-glow: rgba(184,84,80,0.15);
    --amber: #c9a96e;
    --amber-glow: rgba(201,169,110,0.15);
    --mono: 'IBM Plex Mono', monospace;
    --arabic: 'Noto Naskh Arabic', serif;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }

  /* Header */
  .header { padding: 28px 20px 16px; text-align: center; background: var(--bg); }
  .header h1 { font-family: var(--arabic); font-size: 32px; font-weight: 700; letter-spacing: 3px; color: var(--text); }
  .header .subtitle { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); margin-top: 6px; }
  .header .live-clock { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 10px; letter-spacing: 2px; }

  /* Navigation */
  .nav { display: flex; justify-content: center; gap: 10px; padding: 16px 20px; background: var(--bg); }
  .nav-btn { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; padding: 10px 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; border-radius: 6px; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

  /* Screens */
  .screen { display: none; padding: 16px; max-width: 720px; margin: 0 auto; min-height: calc(100vh - 180px); }
  .screen.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .card h2 { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--text-secondary); margin-bottom: 20px; }

  /* Location Screen */
  .coords-display { font-family: var(--mono); font-size: 14px; color: var(--accent); margin-bottom: 12px; }
  .location-name { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
  #map { height: 280px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; background: var(--surface-elevated); }
  .btn-primary { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; padding: 14px 24px; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.2s; -webkit-tap-highlight-color: transparent; font-weight: 600; }
  .btn-primary:hover { background: var(--accent-light); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .gps-btn { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; padding: 12px 16px; background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; border-radius: 8px; margin-bottom: 12px; width: 100%; -webkit-tap-highlight-color: transparent; }
  .gps-btn:hover { border-color: var(--accent); color: var(--accent); }
  .gps-btn:disabled { opacity: 0.5; }

  /* Prayer Cards - EXACT match to pitch */
  .prayer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
  .prayer-card.forbidden { border-color: var(--red); background: linear-gradient(135deg, var(--surface) 0%, var(--red-glow) 100%); }
  .prayer-card.allowed { border-color: var(--green); background: linear-gradient(135deg, var(--surface) 0%, var(--green-glow) 100%); }
  .prayer-card.past-preferred { border-color: var(--amber); background: linear-gradient(135deg, var(--surface) 0%, var(--amber-glow) 100%); }
  .prayer-info { flex: 1; min-width: 0; }
  .prayer-name-ar { font-family: var(--arabic); font-size: 24px; font-weight: 600; color: var(--text); }
  .prayer-name-en { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); margin-top: 4px; }
  .prayer-angle { font-family: var(--mono); font-size: 9px; color: var(--text-muted); margin-top: 6px; letter-spacing: 1px; }
  .prayer-time { font-family: var(--mono); font-size: 26px; font-weight: 500; text-align: right; white-space: nowrap; color: var(--text); }
  .prayer-end { font-family: var(--mono); font-size: 9px; color: var(--text-muted); margin-top: 4px; text-align: right; }
  .badge { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 12px; border-radius: 4px; display: inline-block; margin-top: 10px; font-weight: 500; }
  .badge.forbidden { background: var(--red); color: #fff; }
  .badge.allowed { background: var(--green); color: #fff; }
  .badge.past { background: var(--amber); color: var(--bg); }
  .badge.istiwa { background: var(--red); color: #fff; }

  /* Status text on right side like pitch */
  .status-text { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; }
  .status-text.forbidden { color: var(--red); }
  .status-text.allowed { color: var(--green); }
  .status-text.upcoming { color: var(--green-light); }
  .status-text.past { color: var(--amber); }

  /* Range Screen */
  .range-controls { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .range-select { font-family: var(--mono); font-size: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-elevated); color: var(--text); width: 100%; margin-bottom: 16px; }
  .range-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  .range-table th { text-align: left; padding: 12px 8px; border-bottom: 2px solid var(--border); font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; font-size: 9px; color: var(--text-muted); }
  .range-table td { padding: 12px 8px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
  .range-table td:first-child { color: var(--text); font-weight: 500; }
  .range-table tr:hover td { background: var(--surface-elevated); }
  .export-btn { margin-top: 20px; }
  .export-status { font-family: var(--mono); font-size: 10px; color: var(--green); margin-top: 12px; text-align: center; }
  .export-status.error { color: var(--red); }

  /* Range selector buttons like pitch */
  .range-btns { display: flex; gap: 10px; margin-bottom: 20px; }
  .range-btn { flex: 1; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 12px; border: 1px solid var(--border); background: var(--surface-elevated); color: var(--text-secondary); cursor: pointer; border-radius: 8px; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .range-btn:hover { border-color: var(--accent); color: var(--accent); }
  .range-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(201,169,110,0.1); }

  /* Footer */
  .footer { text-align: center; padding: 32px 24px; font-family: var(--mono); font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; border-top: 1px solid var(--border); margin-top: 40px; }

  /* Error/Info boxes */
  .error-box { background: var(--red-glow); border: 1px solid var(--red); color: var(--red-light); padding: 14px; border-radius: 8px; font-family: var(--mono); font-size: 10px; margin: 12px 0; line-height: 1.5; }
  .info-box { background: var(--amber-glow); border: 1px solid var(--accent-dark); color: var(--accent); padding: 14px; border-radius: 8px; font-family: var(--mono); font-size: 10px; margin: 12px 0; }

  /* Loading */
  .loading { text-align: center; padding: 40px; font-family: var(--mono); font-size: 11px; color: var(--text-secondary); letter-spacing: 2px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Section labels like pitch */
  .section-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--text-muted); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

  /* Map pin label */
  .map-label { font-family: var(--mono); font-size: 10px; color: var(--text-secondary); text-align: center; margin-bottom: 16px; }

  /* Leaflet dark mode overrides */
  .leaflet-container { background: var(--surface-elevated) !important; }

  @media (max-width: 480px) {
    .header h1 { font-size: 26px; }
    .prayer-time { font-size: 22px; }
    #map { height: 240px; }
    .range-table { font-size: 9px; }
    .range-table th, .range-table td { padding: 8px 4px; }
    .prayer-card { flex-direction: column; align-items: flex-start; gap: 10px; }
    .prayer-time { text-align: left; }
    .prayer-end { text-align: left; }
    .status-text { text-align: left; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>مواقيت</h1>
  <div class="subtitle">Islamic Prayer Times · Astronomically Precise · Location Aware</div>
  <div class="live-clock" id="liveClock">--:--:--</div>
</div>

<div class="nav">
  <button class="nav-btn active" data-screen="location">Location</button>
  <button class="nav-btn" data-screen="today">Today</button>
  <button class="nav-btn" data-screen="range">Range & Export</button>
</div>

<!-- SCREEN 1: LOCATION -->
<div class="screen active" id="screen-location">
  <div class="card">
    <h2>GPS Location</h2>
    <div class="coords-display" id="coordsDisplay">No location set</div>
    <div class="location-name" id="locationName">--</div>
    <button class="gps-btn" id="gpsBtn">📍 Detect My Location via GPS</button>
    <div id="map"></div>
    <div class="map-label">Drag the pin to adjust manually</div>
    <button class="btn-primary" id="confirmBtn" disabled>Confirm Location</button>
    <div id="locError"></div>
  </div>
</div>

<!-- SCREEN 2: TODAY'S PRAYERS -->
<div class="screen" id="screen-today">
  <div class="section-label">Today's Prayers</div>
  <div id="todayPrayers">
    <div class="loading"><span class="spinner"></span>Please set your location first</div>
  </div>
</div>

<!-- SCREEN 3: RANGE & EXPORT -->
<div class="screen" id="screen-range">
  <div class="card">
    <h2>Select Range</h2>
    <div class="range-btns">
      <button class="range-btn" data-days="1">1 Day</button>
      <button class="range-btn active" data-days="7">1 Week</button>
      <button class="range-btn" data-days="30">1 Month</button>
    </div>
    <div id="rangeTableContainer">
      <div class="loading">Select a range to generate table</div>
    </div>
    <button class="btn-primary export-btn" id="exportBtn">Add to Google Calendar</button>
    <div class="export-status" id="exportStatus"></div>
  </div>
</div>

<div class="footer">Mawaqit · Static · Free · Astronomically Precise · <span id="year"></span></div>

<!-- Load Leaflet from cdnjs (most reliable) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>

<!-- Load Adhan.js from jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/dist/adhan.umd.min.js" crossorigin="anonymous"></script>

<script>
// ==================== CONFIG ====================
const CONFIG = {
  FAJR_ANGLE: 18,
  MAGHRIB_ANGLE: 18,
  ISHA_ANGLE: 21,
  ASR_SHADOW_FACTOR: 1,
  GOOGLE_CLIENT_ID: '',
  POST_FAJR_MINUTES: 15,
  ISTIWA_MINUTES_BEFORE: 5,
  PRAYER_DURATION: 30,
};

// ==================== STATE ====================
let state = {
  lat: null,
  lng: null,
  locationName: '',
  map: null,
  marker: null,
  prayerTimes: null,
  rangeData: [],
  googleToken: null,
  libsLoaded: { leaflet: false, adhan: false },
  currentRange: 7
};

// ==================== SCREEN NAVIGATION ====================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelector('.nav-btn[data-screen="' + name + '"]').classList.add('active');

  if (name === 'today' && state.lat) renderToday();
  if (name === 'range' && state.lat) generateRange(state.currentRange);
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    showScreen(this.dataset.screen);
  });
});

// ==================== LIBRARY CHECK & INIT ====================
function checkLibs() {
  state.libsLoaded.leaflet = typeof L !== 'undefined';
  state.libsLoaded.adhan = typeof adhan !== 'undefined';

  var errorDiv = document.getElementById('locError');

  if (state.libsLoaded.leaflet && state.libsLoaded.adhan) {
    errorDiv.innerHTML = '';
    initMap();
  } else {
    var errors = [];
    if (!state.libsLoaded.leaflet) errors.push('Leaflet map library');
    if (!state.libsLoaded.adhan) errors.push('Adhan.js prayer library');
    errorDiv.innerHTML = '<div class="error-box">Failed to load: ' + errors.join(', ') + '.<br>This usually means the CDN is blocked or your connection is slow.<br>Try using a VPN or wait a moment and refresh.</div>';
  }
}

// Retry loading for up to 10 seconds
var libCheckInterval = setInterval(function() {
  if (typeof L !== 'undefined' && typeof adhan !== 'undefined') {
    clearInterval(libCheckInterval);
    checkLibs();
  }
}, 500);

setTimeout(function() {
  clearInterval(libCheckInterval);
  checkLibs();
}, 10000);

// ==================== MAP ====================
function initMap() {
  if (!state.libsLoaded.leaflet) return;

  try {
    var defaultLat = 21.4225;
    var defaultLng = 39.8262;

    state.map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(state.map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(state.map);

    state.marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(state.map);
    state.marker.on('dragend', function(e) {
      var pos = e.target.getLatLng();
      updateCoords(pos.lat, pos.lng);
    });

    state.map.on('click', function(e) {
      state.marker.setLatLng(e.latlng);
      updateCoords(e.latlng.lat, e.latlng.lng);
    });

    updateCoords(defaultLat, defaultLng);
  } catch (err) {
    document.getElementById('locError').innerHTML = '<div class="error-box">Map error: ' + err.message + '</div>';
  }
}

function updateCoords(lat, lng) {
  state.lat = lat;
  state.lng = lng;
  document.getElementById('coordsDisplay').textContent = lat.toFixed(4) + '°N · ' + lng.toFixed(4) + '°E';
  document.getElementById('confirmBtn').disabled = false;

  fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var name = data.display_name || data.name || 'Unknown Location';
      state.locationName = name;
      document.getElementById('locationName').textContent = name;
    })
    .catch(function() {
      state.locationName = 'Custom Location';
      document.getElementById('locationName').textContent = 'Custom Location';
    });
}

function requestGPS() {
  if (!navigator.geolocation) {
    alert('Geolocation not supported by your browser');
    return;
  }

  var btn = document.getElementById('gpsBtn');
  btn.textContent = 'Detecting...';
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      if (state.map) {
        state.map.setView([lat, lng], 15);
        state.marker.setLatLng([lat, lng]);
      }
      updateCoords(lat, lng);
      btn.textContent = '✓ Location Detected';
      setTimeout(function() { btn.textContent = '📍 Detect My Location via GPS'; btn.disabled = false; }, 2000);
    },
    function(err) {
      alert('GPS error: ' + err.message);
      btn.textContent = '📍 Detect My Location via GPS';
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

document.getElementById('gpsBtn').addEventListener('click', requestGPS);

function confirmLocation() {
  renderToday();
  generateRange(state.currentRange);
  showScreen('today');
}

document.getElementById('confirmBtn').addEventListener('click', confirmLocation);

// ==================== PRAYER CALCULATIONS ====================
function getPrayerTimesForDate(date) {
  if (!state.libsLoaded.adhan || !state.lat || !state.lng) return null;

  try {
    var coords = new adhan.Coordinates(state.lat, state.lng);
    var params = adhan.CalculationMethod.Other();
    params.fajrAngle = CONFIG.FAJR_ANGLE;
    params.maghribAngle = CONFIG.MAGRIB_ANGLE;
    params.ishaAngle = CONFIG.ISHA_ANGLE;
    params.madhab = adhan.Madhab.Shafi;

    var times = new adhan.PrayerTimes(coords, date, params);
    return {
      fajr: times.fajr,
      sunrise: times.sunrise,
      dhuhr: times.dhuhr,
      asr: times.asr,
      maghrib: times.maghrib,
      isha: times.isha,
    };
  } catch (err) {
    console.error('Prayer calc error:', err);
    return null;
  }
}

function formatTime(date) {
  if (!date || isNaN(date.getTime())) return '--:--';
  return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function formatDate(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ==================== FORBIDDEN WINDOWS ====================
function getForbiddenStatus(prayer, times, now) {
  var fajrEnd = new Date(times.sunrise.getTime() + CONFIG.POST_FAJR_MINUTES * 60000);
  var istiwaStart = new Date(times.dhuhr.getTime() - CONFIG.ISTIWA_MINUTES_BEFORE * 60000);
  var maghribMs = times.maghrib.getTime();
  var nextFajrMs = times.fajr.getTime() + 24 * 60 * 60 * 1000;
  var astronomicalMidnight = new Date(maghribMs + (nextFajrMs - maghribMs) / 2);

  switch(prayer) {
    case 'fajr':
      if (now >= times.fajr && now < fajrEnd) {
        return { status: 'forbidden', label: 'FORBIDDEN ' + formatTime(times.sunrise) + '-' + formatTime(fajrEnd), until: fajrEnd };
      }
      if (now >= fajrEnd && now < times.sunrise) {
        return { status: 'forbidden', label: 'FORBIDDEN ' + formatTime(times.sunrise) + '-' + formatTime(fajrEnd), until: fajrEnd };
      }
      return { status: 'allowed', label: '' };

    case 'dhuhr':
      if (now >= istiwaStart && now < times.dhuhr) {
        return { status: 'forbidden', label: 'ISTIWA' — WAIT', until: times.dhuhr };
      }
      return { status: 'allowed', label: 'ALLOWED NOW' };

    case 'asr':
      if (now >= times.asr && now < times.maghrib) {
        return { status: 'forbidden', label: 'NAFL FORBIDDEN', until: times.maghrib };
      }
      return { status: 'allowed', label: 'UPCOMING' };

    case 'maghrib':
      return { status: 'allowed', label: 'UPCOMING' };

    case 'isha':
      if (now > astronomicalMidnight) {
        return { status: 'past-preferred', label: 'PAST PREFERRED', until: times.fajr };
      }
      return { status: 'allowed', label: 'UPCOMING' };

    default:
      return { status: 'allowed', label: '' };
  }
}

// ==================== TODAY SCREEN ====================
function renderToday() {
  var container = document.getElementById('todayPrayers');
  var now = new Date();
  var times = getPrayerTimesForDate(now);

  if (!times) {
    container.innerHTML = '<div class="loading">Please set your location first</div>';
    return;
  }

  state.prayerTimes = times;

  var prayers = [
    { key: 'fajr', ar: 'الفجر', en: 'Fajr', angle: '-18°' },
    { key: 'dhuhr', ar: 'الظهر', en: 'Dhuhr · Zawal', angle: 'Solar Noon' },
    { key: 'asr', ar: 'العصر', en: 'Asr · Shadow 1:1', angle: 'Shadow Factor 1' },
    { key: 'maghrib', ar: 'المغرب', en: 'Maghrib', angle: '-18°' },
    { key: 'isha', ar: 'العشاء', en: 'Isha', angle: '-21°' },
  ];

  var html = '';
  prayers.forEach(function(p) {
    var time = times[p.key];
    var status = getForbiddenStatus(p.key, times, now);
    var cardClass = status.status === 'forbidden' ? 'forbidden' : 
                     status.status === 'past-preferred' ? 'past-preferred' : 'allowed';

    var statusClass = status.status === 'forbidden' ? 'forbidden' : 
                      status.status === 'past-preferred' ? 'past' : 
                      (p.key === 'fajr' || p.key === 'dhuhr') && status.status === 'allowed' ? 'allowed' : 'upcoming';

    var statusText = status.status === 'forbidden' ? status.label : 
                     status.status === 'past-preferred' ? status.label :
                     status.label || 'UPCOMING';

    html += '<div class="prayer-card ' + cardClass + '">' +
      '<div class="prayer-info">' +
        '<div class="prayer-name-ar">' + p.ar + '</div>' +
        '<div class="prayer-name-en">' + p.en + ' · ' + p.angle + '</div>' +
      '</div>' +
      '<div>' +
        '<div class="prayer-time">' + formatTime(time) + '</div>' +
        '<div class="status-text ' + statusClass + '">' + statusText + '</div>' +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}

// ==================== LIVE CLOCK ====================
setInterval(function() {
  var now = new Date();
  document.getElementById('liveClock').textContent = 
    now.toLocaleTimeString('en-US', { hour12: false }) + ' · ' + 
    now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  if (document.getElementById('screen-today').classList.contains('active') && state.lat) {
    renderToday();
  }
}, 1000);

// ==================== RANGE SCREEN ====================
document.querySelectorAll('.range-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.range-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    state.currentRange = parseInt(this.dataset.days);
    if (state.lat) generateRange(state.currentRange);
  });
});

function generateRange(days) {
  var container = document.getElementById('rangeTableContainer');

  if (!state.lat) {
    container.innerHTML = '<div class="loading">Please set your location first</div>';
    return;
  }

  var html = '<table class="range-table"><thead><tr>' +
    '<th>Date</th><th>Fajr</th><th>Dhuhr</th><th>Asr</th><th>Maghrib</th><th>Isha</th>' +
    '</tr></thead><tbody>';

  state.rangeData = [];
  var today = new Date();

  for (var i = 0; i < days; i++) {
    var date = new Date(today);
    date.setDate(today.getDate() + i);

    var times = getPrayerTimesForDate(date);
    if (!times) continue;

    var row = {
      date: date,
      fajr: times.fajr,
      dhuhr: times.dhuhr,
      asr: times.asr,
      maghrib: times.maghrib,
      isha: times.isha,
    };
    state.rangeData.push(row);

    html += '<tr>' +
      '<td>' + formatDate(date) + '</td>' +
      '<td>' + formatTime(times.fajr) + '</td>' +
      '<td>' + formatTime(times.dhuhr) + '</td>' +
      '<td>' + formatTime(times.asr) + '</td>' +
      '<td>' + formatTime(times.maghrib) + '</td>' +
      '<td>' + formatTime(times.isha) + '</td>' +
    '</tr>';
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

// ==================== GOOGLE CALENDAR EXPORT ====================
document.getElementById('exportBtn').addEventListener('click', exportToGoogleCalendar);

function exportToGoogleCalendar() {
  if (!CONFIG.GOOGLE_CLIENT_ID) {
    alert('Google Calendar export requires setup.

1. Go to Google Cloud Console
2. Enable Google Calendar API
3. Create OAuth 2.0 Client ID
4. Add your GitHub Pages URL
5. Paste Client ID in config.js');
    return;
  }

  if (!state.rangeData.length) {
    alert('Please generate a range table first');
    return;
  }

  if (typeof google === 'undefined' || !google.accounts) {
    document.getElementById('exportStatus').textContent = 'Google Sign-In not loaded. Refresh and try again.';
    document.getElementById('exportStatus').className = 'export-status error';
    return;
  }

  var tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: function(tokenResponse) {
      if (tokenResponse.error) {
        document.getElementById('exportStatus').textContent = 'Error: ' + tokenResponse.error;
        document.getElementById('exportStatus').className = 'export-status error';
        return;
      }
      state.googleToken = tokenResponse.access_token;
      batchCreateEvents();
    },
  });

  tokenClient.requestAccessToken();
}

function batchCreateEvents() {
  var statusEl = document.getElementById('exportStatus');
  statusEl.textContent = 'Creating events...';
  statusEl.className = 'export-status';

  var prayers = [
    { key: 'fajr', ar: 'الفجر', en: 'Fajr' },
    { key: 'dhuhr', ar: 'الظهر', en: 'Dhuhr' },
    { key: 'asr', ar: 'العصر', en: 'Asr' },
    { key: 'maghrib', ar: 'المغرب', en: 'Maghrib' },
    { key: 'isha', ar: 'العشاء', en: 'Isha' },
  ];

  var created = 0;
  var total = state.rangeData.length * prayers.length;
  var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  state.rangeData.forEach(function(day) {
    prayers.forEach(function(p) {
      var start = day[p.key];
      var end = new Date(start.getTime() + CONFIG.PRAYER_DURATION * 60000);

      var event = {
        summary: p.ar + ' · ' + p.en,
        description: 'Astronomically calculated for ' + state.locationName + ' (lat: ' + state.lat.toFixed(3) + ', lng: ' + state.lng.toFixed(3) + ')

Mawaqit Prayer Time',
        start: { dateTime: start.toISOString(), timeZone: tz },
        end: { dateTime: end.toISOString(), timeZone: tz },
        reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 10 }] },
      };

      fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + state.googleToken,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(event),
      })
      .then(function(r) { return r.json(); })
      .then(function() {
        created++;
        statusEl.textContent = 'Created ' + created + '/' + total + ' events...';
        if (created >= total) {
          statusEl.textContent = '✓ Successfully created ' + total + ' prayer events!';
        }
      })
      .catch(function(err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'export-status error';
      });
    });
  });
}
