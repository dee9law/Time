<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mawaqit</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card: #161616;
    --card-2: #1e1e1e;
    --text: #e8e8e8;
    --text-2: #888888;
    --text-3: #555555;
    --border: #2a2a2a;
    --gold: #c9a96e;
    --green: #4a7c59;
    --red: #b85450;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); 
    color: var(--text); 
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .header { text-align:center; padding: 28px 16px 12px; }
  .header h1 { font-family: 'Times New Roman', serif; font-size: 32px; letter-spacing: 3px; font-weight: 700; }
  .header .sub { font-family: 'Courier New', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-2); margin-top: 6px; }
  .header .clock { font-family: 'Courier New', monospace; font-size: 11px; color: var(--gold); margin-top: 10px; letter-spacing: 2px; }
  .nav { display: flex; justify-content: center; gap: 10px; padding: 12px 16px 20px; }
  .nav-btn { font-family: 'Courier New', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; padding: 10px 20px; border: 1px solid var(--border); background: var(--card); color: var(--text-2); border-radius: 6px; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
  .nav-btn:hover { border-color: var(--gold); color: var(--gold); }
  .nav-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 700; }
  .screen { display: none; padding: 0 16px 24px; max-width: 600px; margin: 0 auto; }
  .screen.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .card h2 { font-family: 'Courier New', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--text-2); margin-bottom: 20px; }
  .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .input-row input { flex: 1; font-family: 'Courier New', monospace; font-size: 14px; padding: 12px 14px; background: var(--card-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; -webkit-appearance: none; }
  .input-row input:focus { border-color: var(--gold); }
  .input-row input::placeholder { color: var(--text-3); }
  .coords { font-family: 'Courier New', monospace; font-size: 14px; color: var(--gold); margin: 12px 0 8px; }
  .loc-name { font-size: 14px; color: var(--text-2); margin-bottom: 16px; }
  .btn { font-family: 'Courier New', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; padding: 14px 24px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; transition: opacity 0.2s; -webkit-tap-highlight-color: transparent; }
  .btn-gold { background: var(--gold); color: var(--bg); }
  .btn-gold:active { opacity: 0.8; }
  .btn-dark { background: var(--card-2); color: var(--text-2); border: 1px solid var(--border); margin-bottom: 12px; }
  .btn-dark:active { border-color: var(--gold); color: var(--gold); }
  .prayer-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .prayer-card.forbidden { border-color: var(--red); }
  .prayer-card.allowed { border-color: var(--green); }
  .prayer-card.past { border-color: var(--gold); }
  .prayer-name { font-family: 'Times New Roman', serif; font-size: 24px; font-weight: 600; }
  .prayer-sub { font-family: 'Courier New', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-2); margin-top: 4px; }
  .prayer-right { text-align: right; }
  .prayer-time { font-family: 'Courier New', monospace; font-size: 26px; font-weight: 500; }
  .prayer-status { font-family: 'Courier New', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; }
  .prayer-status.red { color: var(--red); }
  .prayer-status.green { color: var(--green); }
  .prayer-status.gold { color: var(--gold); }
  .range-btns { display: flex; gap: 8px; margin-bottom: 16px; }
  .range-btn { flex: 1; font-family: 'Courier New', monospace; font-size: 10px; padding: 10px; border: 1px solid var(--border); background: var(--card-2); color: var(--text-2); border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .range-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.1); }
  table { width: 100%; font-family: 'Courier New', monospace; font-size: 10px; border-collapse: collapse; }
  th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); color: var(--text-3); text-transform: uppercase; letter-spacing: 1.5px; font-size: 8px; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); color: var(--text-2); }
  td:first-child { color: var(--text); font-weight: 500; }
  tr:hover td { background: var(--card-2); }
  .footer { text-align: center; padding: 32px 24px; font-family: 'Courier New', monospace; font-size: 8px; color: var(--text-3); text-transform: uppercase; letter-spacing: 2px; border-top: 1px solid var(--border); margin-top: 40px; }
  .error-box { background: rgba(184,84,80,0.1); border: 1px solid var(--red); color: var(--red); padding: 12px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 10px; margin: 10px 0; }
  .debug-box { background: var(--card-2); border: 1px solid var(--border); color: var(--text-2); padding: 12px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 9px; margin: 10px 0; white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 480px) { .header h1 { font-size: 26px; } .prayer-time { font-size: 22px; } .prayer-card { flex-direction: column; align-items: flex-start; gap: 8px; } .prayer-right { text-align: left; } }
</style>
</head>
<body>

<div class="header">
  <h1>&#1605;&#1608;&#1575;&#1602;&#1610;&#1578;</h1>
  <div class="sub">Islamic Prayer Times &middot; Astronomically Precise &middot; Location Aware</div>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div class="nav">
  <button class="nav-btn active" id="nav-loc" onclick="goTo('loc')">Location</button>
  <button class="nav-btn" id="nav-today" onclick="goTo('today')">Today</button>
  <button class="nav-btn" id="nav-range" onclick="goTo('range')">Range</button>
</div>

<div class="screen active" id="loc">
  <div class="card">
    <h2>GPS Location</h2>
    <div class="input-row">
      <input type="number" id="latInput" placeholder="Latitude" step="0.0001" value="21.4225">
      <input type="number" id="lngInput" placeholder="Longitude" step="0.0001" value="39.8262">
    </div>
    <div class="coords" id="coords">21.4225&deg;N &middot; 39.8262&deg;E</div>
    <div class="loc-name" id="locName">Mecca, Saudi Arabia</div>
    <button class="btn btn-dark" onclick="detectGPS()">&#128205; Detect My Location via GPS</button>
    <button class="btn btn-gold" onclick="manualSet()">Set Location Manually</button>
    <button class="btn btn-gold" onclick="confirmLoc()" style="margin-top:8px">Confirm Location</button>
    <div class="debug-box" id="debugBox" style="display:none"></div>
  </div>
</div>

<div class="screen" id="today">
  <div id="prayers"></div>
</div>

<div class="screen" id="range">
  <div class="card">
    <h2>Select Range</h2>
    <div class="range-btns">
      <button class="range-btn" id="r1" onclick="setRange(1)">1 Day</button>
      <button class="range-btn active" id="r7" onclick="setRange(7)">1 Week</button>
      <button class="range-btn" id="r30" onclick="setRange(30)">1 Month</button>
    </div>
    <div id="rangeTable"></div>
    <button class="btn btn-gold" style="margin-top:16px" onclick="exportCal()">Add to Google Calendar</button>
  </div>
</div>

<div class="footer">Mawaqit &middot; Static &middot; Free &middot; Astronomically Precise &middot; <span id="yr"></span></div>

<script>
// Error handling
window.onerror = function(msg, url, line) {
  var box = document.getElementById('debugBox');
  if(box) { box.style.display = 'block'; box.textContent = 'ERROR: ' + msg + ' (line ' + line + ')'; }
  return false;
};

try {
  var S = { lat: 21.4225, lng: 39.8262, name: 'Mecca, Saudi Arabia', range: 7 };

  function goTo(screenId) {
    document.getElementById('loc').classList.remove('active');
    document.getElementById('today').classList.remove('active');
    document.getElementById('range').classList.remove('active');
    document.getElementById(screenId).classList.add('active');
    document.getElementById('nav-loc').classList.remove('active');
    document.getElementById('nav-today').classList.remove('active');
    document.getElementById('nav-range').classList.remove('active');
    document.getElementById('nav-' + screenId).classList.add('active');
    if(screenId === 'today') showToday();
    if(screenId === 'range') showRange(S.range);
  }

  function updateClock() {
    var d = new Date();
    var time = d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    var date = d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
    var el = document.getElementById('clock');
    if(el) el.textContent = time + ' &middot; ' + date;
    if(document.getElementById('today').classList.contains('active')) showToday();
  }
  setInterval(updateClock, 1000);
  updateClock();
  document.getElementById('yr').textContent = new Date().getFullYear();

  function updateCoords() {
    var coordsEl = document.getElementById('coords');
    var latEl = document.getElementById('latInput');
    var lngEl = document.getElementById('lngInput');
    if(coordsEl) coordsEl.textContent = S.lat.toFixed(4) + '&deg;N &middot; ' + S.lng.toFixed(4) + '&deg;E';
    if(latEl) latEl.value = S.lat;
    if(lngEl) lngEl.value = S.lng;
    fetch('https://nominatim.openstreetmap.org/reverse?lat=' + S.lat + '&lon=' + S.lng + '&format=json')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        S.name = d.display_name || d.name || 'Custom Location';
        var nameEl = document.getElementById('locName');
        if(nameEl) nameEl.textContent = S.name;
      })
      .catch(function() {
        S.name = 'Custom Location';
        var nameEl = document.getElementById('locName');
        if(nameEl) nameEl.textContent = S.name;
      });
  }

  function manualSet() {
    var latVal = parseFloat(document.getElementById('latInput').value);
    var lngVal = parseFloat(document.getElementById('lngInput').value);
    if(isNaN(latVal) || isNaN(lngVal)) { alert('Please enter valid numbers'); return; }
    S.lat = latVal; S.lng = lngVal;
    updateCoords();
  }

  function detectGPS() {
    if(!navigator.geolocation) { alert('GPS not supported'); return; }
    var btn = event.target;
    btn.textContent = 'Detecting...';
    navigator.geolocation.getCurrentPosition(
      function(pos) { S.lat = pos.coords.latitude; S.lng = pos.coords.longitude; updateCoords(); btn.textContent = 'Location Detected'; setTimeout(function() { btn.textContent = 'Detect My Location via GPS'; }, 2000); },
      function(err) { alert('GPS error: ' + err.message); btn.textContent = 'Detect My Location via GPS'; },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function confirmLoc() {
    manualSet();
    showToday();
    showRange(S.range);
    goTo('today');
  }

  function calcPrayer(date) {
    var lat = S.lat, lng = S.lng;
    var tz = -date.getTimezoneOffset() / 60;
    var year = date.getFullYear();
    var month = date.getMonth() + 1;
    var day = date.getDate();
    if(month <= 2) { year -= 1; month += 12; }
    var A = Math.floor(year / 100);
    var B = 2 - A + Math.floor(A / 4);
    var jd = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
    var n = jd - 2451545.0;
    var L = (280.460 + 0.9856474 * n) % 360;
    if(L < 0) L += 360;
    var g = ((357.528 + 0.9856003 * n) % 360) * Math.PI / 180;
    if(g < 0) g += 2 * Math.PI;
    var lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2*g)) * Math.PI / 180;
    var epsilon = (23.439 - 0.0000004 * n) * Math.PI / 180;
    var decl = Math.asin(Math.sin(epsilon) * Math.sin(lambda));
    var eqt = 4 * (L - lambda * 180 / Math.PI);
    var noonUTC = 12 - lng/15 + eqt/60;
    var noonLocal = noonUTC - tz;
    function timeForAngle(angle, isMorning) {
      var latRad = lat * Math.PI / 180;
      var cosH = (Math.cos(angle * Math.PI / 180) - Math.sin(latRad) * Math.sin(decl)) / (Math.cos(latRad) * Math.cos(decl));
      if(cosH < -1 || cosH > 1) return null;
      var H = Math.acos(cosH) * 180 / Math.PI;
      var solarTime = noonUTC + (isMorning ? -1 : 1) * H / 15;
      var localTime = solarTime - tz;
      var d = new Date(date);
      d.setHours(Math.floor(localTime), Math.floor((localTime % 1) * 60), 0, 0);
      return d;
    }
    var asrAngle = Math.atan(1 / (1 + Math.tan(Math.abs(lat * Math.PI / 180 - decl)))) * 180 / Math.PI;
    return {
      fajr: timeForAngle(-18, true),
      sunrise: timeForAngle(-0.833, true),
      dhuhr: (function(){ var d=new Date(date); d.setHours(Math.floor(noonLocal),Math.floor((noonLocal%1)*60),0,0); return d; })(),
      asr: timeForAngle(asrAngle, false),
      maghrib: timeForAngle(-0.833, false),
      isha: timeForAngle(-21, false)
    };
  }

  function fmtTime(d) {
    if(!d || isNaN(d.getTime())) return '--:--';
    var h = d.getHours(), m = d.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }
  function fmtDate(d) { return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }

  function showToday() {
    var now = new Date();
    var t = calcPrayer(now);
    if(!t || !t.fajr) {
      document.getElementById('prayers').innerHTML = '<div class="error-box">Unable to calculate prayer times. Check location.</div>';
      return;
    }
    var prayers = [
      {k:'fajr', ar:'&#1575;&#1604;&#1601;&#1580;&#1585;', en:'Fajr', a:'-18&deg;'},
      {k:'dhuhr', ar:'&#1575;&#1604;&#1592;&#1607;&#1585;', en:'Dhuhr &middot; Zawal', a:'Solar Noon'},
      {k:'asr', ar:'&#1575;&#1604;&#1593;&#1589;&#1585;', en:'Asr &middot; Shadow 1:1', a:'Shadow Factor 1'},
      {k:'maghrib', ar:'&#1575;&#1604;&#1605;&#1594;&#1585;&#1576;', en:'Maghrib', a:'-18&deg;'},
      {k:'isha', ar:'&#1575;&#1604;&#1593;&#1588;&#1575;&#1569;', en:'Isha', a:'-21&deg;'},
    ];
    var html = '';
    prayers.forEach(function(p) {
      var time = t[p.k];
      var status = getStatus(p.k, t, now);
      var cls = status.st;
      var stColor = status.st==='forbidden'?'red':status.st==='past'?'gold':'green';
      html += '<div class="prayer-card '+cls+'"><div><div class="prayer-name">'+p.ar+'</div><div class="prayer-sub">'+p.en+' &middot; '+p.a+'</div></div><div class="prayer-right"><div class="prayer-time">'+fmtTime(time)+'</div><div class="prayer-status '+stColor+'">'+status.txt+'</div></div></div>';
    });
    document.getElementById('prayers').innerHTML = html;
  }

  function getStatus(prayer, times, now) {
    var fajrEnd = new Date(times.sunrise.getTime()+15*60000);
    var istiwa = new Date(times.dhuhr.getTime()-5*60000);
    var mid = new Date(times.maghrib.getTime()+(times.fajr.getTime()+24*3600000-times.maghrib.getTime())/2);
    switch(prayer) {
      case 'fajr': if(now>=times.fajr&&now<fajrEnd)return{st:'forbidden',txt:'FORBIDDEN'}; if(now>=fajrEnd&&now<times.sunrise)return{st:'forbidden',txt:'FORBIDDEN'}; return{st:'allowed',txt:'ALLOWED NOW'};
      case 'dhuhr': if(now>=istiwa&&now<times.dhuhr)return{st:'forbidden',txt:"ISTIWA' - WAIT"}; return{st:'allowed',txt:'ALLOWED NOW'};
      case 'asr': if(now>=times.asr&&now<times.maghrib)return{st:'forbidden',txt:'NAFL FORBIDDEN'}; return{st:'allowed',txt:'UPCOMING'};
      case 'maghrib': return{st:'allowed',txt:'UPCOMING'};
      case 'isha': if(now>mid)return{st:'past',txt:'PAST PREFERRED'}; return{st:'allowed',txt:'UPCOMING'};
    }
    return{st:'allowed',txt:''};
  }

  function setRange(n) {
    S.range = n;
    document.getElementById('r1').classList.remove('active');
    document.getElementById('r7').classList.remove('active');
    document.getElementById('r30').classList.remove('active');
    document.getElementById('r'+n).classList.add('active');
    showRange(n);
  }

  function showRange(days) {
    var html = '<table><tr><th>Date</th><th>Fajr</th><th>Dhuhr</th><th>Asr</th><th>Maghrib</th><th>Isha</th></tr>';
    var today = new Date();
    for(var i=0; i<days; i++) {
      var d = new Date(today); d.setDate(today.getDate()+i);
      var t = calcPrayer(d);
      if(!t||!t.fajr) continue;
      html += '<tr><td>'+fmtDate(d)+'</td><td>'+fmtTime(t.fajr)+'</td><td>'+fmtTime(t.dhuhr)+'</td><td>'+fmtTime(t.asr)+'</td><td>'+fmtTime(t.maghrib)+'</td><td>'+fmtTime(t.isha)+'</td></tr>';
    }
    html += '</table>';
    document.getElementById('rangeTable').innerHTML = html;
  }

  function exportCal() {
    alert('Google Calendar export requires OAuth setup.\n1. console.cloud.google.com\n2. Enable Google Calendar API\n3. Create OAuth 2.0 Client ID\n4. Add site URL to authorized origins');
  }

  updateCoords();

} catch(e) {
  var box = document.getElementById('debugBox');
  if(box) { box.style.display = 'block'; box.textContent = 'FATAL: '+e.message; }
}
</script>

</body>
</html>
